shell=zsh
term=xterm-256color
title=foot
font=JetBrainsMono:size=11.5:weight=600
letter-spacing=0
dpi-aware=no
pad=15x15
bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[colors]
alpha=0.9
background=03060A
foreground=d5d8d7

regular0=03060A
regular1=687677
regular2=943F48
regular3=7A8B8A
regular4=879796
regular5=98A5A2
regular6=AAB4B2
regular7=d5d8d7

bright0=959796
bright1=687677
bright2=943F48
bright3=7A8B8A
bright4=879796
bright5=98A5A2
bright6=AAB4B2
bright7=d5d8d7


[text-bindings]
\x03=Control+Shift+c
